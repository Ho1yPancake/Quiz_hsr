name: CI for Quiz_hsr

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: npx --yes html-validate html/**/*.html

      - name: Lint JavaScript
        run: npx --yes eslint script/**/*.js || true

      - name: Build (prepare dist folder)
        run: |
          mkdir -p dist
          cp -r html/* dist/ 2>/dev/null || true
          cp -r script dist/
          cp -r style dist/
          echo "=== Содержимое dist/ ==="
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-hsr-build
          path: dist/
