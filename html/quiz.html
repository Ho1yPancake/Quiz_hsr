<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/normalize.css">
    <link rel="stylesheet" href="../style/quiz.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Викторина - Honkai: Star Rail</title>
</head>
<body>
    <button class="exit-btn" id="exitBtn">← Выйти</button>

    <div class="quiz-container">
        <!-- Шапка викторины -->
        <div class="quiz-header">
            <div class="planet-info">
                <h2 id="planetName" class="planet-name">Загрузка...</h2>
            </div>
            <div class="timer-section">
                <div class="timer-circle">
                    <span id="timerSeconds">30</span>
                    <span class="timer-label">сек</span>
                </div>
            </div>
        </div>

        <!-- Прогресс -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="currentQuestionNum">1</span> / <span id="totalQuestions">60</span>
            </div>
        </div>

        <!-- Блок вопроса -->
        <div class="question-block">
            <p class="question-text" id="questionText">Загрузка вопросов...</p>
        </div>

        <!-- Блок ответов -->
        <div class="answers-grid">
            <button class="answer-btn" data-answer="A">
                <span class="answer-letter">A</span>
                <span class="answer-text" id="answerA">...</span>
            </button>
            <button class="answer-btn" data-answer="B">
                <span class="answer-letter">B</span>
                <span class="answer-text" id="answerB">...</span>
            </button>
            <button class="answer-btn" data-answer="C">
                <span class="answer-letter">C</span>
                <span class="answer-text" id="answerC">...</span>
            </button>
            <button class="answer-btn" data-answer="D">
                <span class="answer-letter">D</span>
                <span class="answer-text" id="answerD">...</span>
            </button>
        </div>

        <!-- Кнопка следующего вопроса -->
        <div class="next-section">
            <button class="next-btn" id="nextBtn" disabled>Следующий вопрос</button>
        </div>
    </div>

    <!-- Модальное окно подтверждения выхода -->
    <div id="exitModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Выход из викторины</h3>
            <p>Если вы выйдете сейчас, прогресс не сохранится и результат не будет засчитан.</p>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" id="cancelExitBtn">Продолжить игру</button>
                <button class="modal-btn confirm-btn" id="confirmExitBtn">Выйти</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно результатов -->
    <div id="resultsModal" class="modal" style="display: none;">
        <div class="modal-content results-content">
            <h2>Результаты викторины</h2>
            <div class="results-stats" id="resultsStats"></div>
            <div class="results-planets" id="resultsPlanets"></div>
            <div class="total-score">
                <span>Общий балл:</span>
                <span id="totalScoreResult">0</span>
            </div>
            <button class="modal-btn finish-btn" id="finishBtn">Завершить</button>
        </div>
    </div>

    <script src="../script/quiz.js"></script>
</body>
</html>
