<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="../style/normalize.css">
    <link rel="stylesheet" href="../style/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Викторина</title>
</head>
<body>
    <div class="menu-container">
        <h1>Викторина по Honkai: Star Rail</h1>
        
        <div id="auth-section">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <div id="login-form" class="auth-form active">
                <div id="login-status" class="status-message"></div>
                <input type="email" id="login-email" class="auth-input" placeholder="Email" required>
                <input type="password" id="login-password" class="auth-input" placeholder="Пароль" required>
                <button id="login-btn" class="menu-btn auth-action-btn">Войти</button>
            </div>

            <div id="register-form" class="auth-form">
                <div id="register-status" class="status-message"></div>
                <input type="text" id="reg-name" class="auth-input" placeholder="Ваше имя" required>
                <input type="email" id="reg-email" class="auth-input" placeholder="Email" required>
                <input type="password" id="reg-password" class="auth-input" placeholder="Пароль" required>
                <button id="register-btn" class="menu-btn auth-action-btn">Зарегистрироваться</button>
            </div>
        </div>

        <div id="main-menu-section" style="display: none;">
            <nav class="menu-nav">
                <button class="menu-btn" onclick="location.href='quiz.html'">Начать викторину</button>
                <button class="menu-btn" onclick="location.href='profile.html'">Профиль</button>
                <button class="menu-btn" onclick="location.href='table.html'">Таблица лидеров</button>
                <button class="menu-btn logout-main-btn" id="logoutMainBtn">Выйти</button>
            </nav>
        </div>
    </div>

    <script src="../script/config.js"></script>
    <script src="../script/auth.js"></script>
</body>
</html>
